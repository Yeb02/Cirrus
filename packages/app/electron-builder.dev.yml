# « Cirrus Dev » (plan 9, D3): `npm run paquet:dev` packages the same build as the official app with this, over
# electron-builder.yml: its name, its appId — so its own installation, beside the official app's —, its icon marked
# « DEV ». It writes dist/Cirrus Dev Setup <version>.exe.
extends: ./electron-builder.yml
appId: io.github.yeb02.cirrus.dev
productName: Cirrus Dev
# Its package name, the one thing that makes it « Cirrus Dev » (identity.ts reads it at each start: its own data folder,
# %APPDATA%\@cirrus\app-dev). The one-click installer names its folder after it, %LOCALAPPDATA%\Programs\@cirrusapp-dev,
# which the official app's (…\cirrus) does not begin: neither installer stops the other's running app (fix round 1 of
# task 3, I2). The uninstaller's --delete-app-data, never passed, would remove « Cirrus Dev »'s data only.
extraMetadata:
  name: "@cirrus/app-dev"
win:
  target: nsis
  icon: build/icon-dev.ico
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  installerIcon: build/icon-dev.ico
  uninstallerIcon: build/icon-dev.ico
