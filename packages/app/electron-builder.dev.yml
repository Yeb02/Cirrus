# « Cirrus Dev » (plan 9, D3): `npm run paquet:dev` builds the app as that variant (`electron-vite build --mode dev`, which
# gives it its data folder, %APPDATA%\@cirrus\app-dev) and then this, over electron-builder.yml: its name, its appId —
# so its own installation, beside the official app's —, its icon marked « DEV ». It writes dist/Cirrus Dev Setup <version>.exe.
extends: ./electron-builder.yml
appId: io.github.yeb02.cirrus.dev
productName: Cirrus Dev
# Its own package name: the uninstaller's --delete-app-data removes %APPDATA%\<package name>, which under the package's
# own name, « @cirrus/app », is the official app's folder and the user's base. Under this one, it is « Cirrus Dev »'s.
extraMetadata:
  name: "@cirrus/app-dev"
win:
  target: nsis
  icon: build/icon-dev.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon-dev.ico
  uninstallerIcon: build/icon-dev.ico
