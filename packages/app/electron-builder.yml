# The Windows installer of Cirrus (plan 9, D3): `npm run paquet` builds the app (electron-vite, into out/) and then
# this, which writes dist/Cirrus Setup <version>.exe. « Cirrus Dev » is electron-builder.dev.yml, over this one.
# out/ holds everything the app runs: electron-vite bundles the workspace packages and the interface's libraries; the
# main process imports only Node's modules and Electron. No node_modules goes into the archive.
appId: io.github.yeb02.cirrus
productName: Cirrus
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!node_modules{,/**}"
asar: true
# No native module: node:sqlite is Node's own.
npmRebuild: false
nodeGypRebuild: false
# Electron's switches a packaged app has no use for (Electron's security checklist): the executable never runs as Node
# (ELECTRON_RUN_AS_NODE), reads no NODE_OPTIONS, takes no --inspect, and loads its code from its archive only.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
# The signed updates (plan 9, D4): a generic provider, so that electron-builder writes latest.yml beside the installer
# (the CI publishes it) and resources/app-update.yml in the app (electron-updater reads its cache folder's name there).
# The address is never used: the app gives electron-updater its own server's versions/, with its token (update/).
# `--publish never` sends nothing anywhere.
publish:
  provider: generic
  url: https://cirrus.invalid/versions/
win:
  target: nsis
  icon: build/icon.ico
# Per user, without administrator rights (%LOCALAPPDATA%\Programs), the folder left to choose. The uninstaller never
# removes the app's data: with --delete-app-data, or deleteAppDataOnUninstall, it would remove %APPDATA%\<package name>,
# which is %APPDATA%\@cirrus\app — the user's base (identity.ts). Not turned on; not to be.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
