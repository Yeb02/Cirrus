# The Windows installer of Cirrus (plan 9, D3): `npm run paquet` builds the app (electron-vite, into out/) and then
# this, which writes dist/Cirrus Setup <version>.exe. « Cirrus Dev » is electron-builder.dev.yml, over this one.
# out/ holds everything the app runs: electron-vite bundles the workspace packages and the interface's libraries; the
# main process imports only Node's modules and Electron. No node_modules goes into the archive.
appId: io.github.yeb02.cirrus
productName: Cirrus
# The archive's package name: the app reads its variant there at each start (identity.ts: anything but « @cirrus/app-dev »
# is the official app); the one-click installer names its folder after it, %LOCALAPPDATA%\Programs\cirrus, of which
# « Cirrus Dev »'s (…\@cirrusapp-dev) is not a continuation; and the uninstaller's --delete-app-data, never passed, would
# remove %APPDATA%\cirrus, never %APPDATA%\@cirrus\app, the user's base (fix round 1 of task 3, I1 and I2).
extraMetadata:
  name: cirrus
directories:
  output: dist
  buildResources: build
# The bench's chunks (benchMode.ts) stay out: a packaged app in bench mode says « Banc non branché » and quits.
files:
  - out/**
  - package.json
  - "!node_modules{,/**}"
  - "!out/main/bench-*.js"
asar: true
# No native module: node:sqlite is Node's own.
npmRebuild: false
nodeGypRebuild: false
# Electron's switches a packaged app has no use for (Electron's security checklist): the executable never runs as Node
# (ELECTRON_RUN_AS_NODE), reads no NODE_OPTIONS, takes no --inspect, and loads its code from its archive only.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
# The signed updates (plan 9, D4): a generic provider, so that electron-builder writes latest.yml beside the installer
# (the CI publishes it) and resources/app-update.yml in the app (electron-updater reads its cache folder's name there).
# The address is never used: the app gives electron-updater its own server's versions/, with its token (update/).
# `--publish never` sends nothing anywhere.
publish:
  provider: generic
  url: https://cirrus.invalid/versions/
win:
  target: nsis
  icon: build/icon.ico
# One click, per user, without administrator rights: %LOCALAPPDATA%\Programs\cirrus, no page, neither a folder nor « all
# users » to choose (fix round 1 of task 3, I1). A chosen folder would be emptied by every update (RMDir /r $INSTDIR),
# and electron-builder adds the app's name to it only if the folder does not contain it already: choosing
# %LOCALAPPDATA%\Cirrus (TinyTeX) or %APPDATA%\@cirrus would have lost them. An installation for all users is not
# supported. The uninstaller never removes the app's data (deleteAppDataOnUninstall, --delete-app-data).
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
